name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bun run lint
      - run: bun check
      # deictic is published: make sure dist builds.
      - run: bun run build
      - run: bun run test
