core:changelogs:
  - content: "---\npackages:\n  deictic:\n    type: minor\n---\n\n### A plugin's page half can put a tag of its own in the caption over what's pointed at, with tag(context, at)\n\nIt answers `{ text, color }` for the point under the pointer, or nothing, and the caption shows it after deictic's own tag: prosebook's names the string's catalog key there, in place of a label of its own that could cover the caption.\n"
