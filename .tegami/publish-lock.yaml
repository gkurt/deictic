core:changelogs:
  - content: "---\npackages:\n  deictic:\n    type: patch\n---\n\n### The popup closes once a task is added\n"
    filename: close-on-add.md
    v: 0.0.0
  - content: "---\npackages:\n  deictic:\n    type: minor\n---\n\n### deictic's own problems are tasks on the board\n\nA package the project hasn't installed, a plugin that failed to set up on the dev server or in the page, or a request\nthat broke is posted as a task, once while it's open, saying what to do: fix the setup, or report deictic's bug.\n`tasks({ problems: false })` posts none. Plugins report their own with `context.report(problem)`, and hear them with\n`problem(problem)`; a server plugin whose `setup` throws no longer stops the others.\n"
    filename: problem-tasks.md
    v: 0.0.0
  - content: "---\npackages:\n  deictic:\n    type: patch\n---\n\n### A task's pin is on the element it's about, of several from one line\n\nA task about one of a list's items says which (`deictic.nth`, and its text as `deictic.text`), and its pin and outline\nfind that one, not the first.\n\n### A screenshot of a page with smooth scrolling is where the page was scrolled\n"
    filename: which-element.md
    v: 0.0.0
